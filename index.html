<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trocado · finanças simples</title>
<meta name="description" content="Anote o que entra e o que sai, veja para onde vai o dinheiro e não esqueça as contas. Grátis, sem anúncios e com tudo guardado só no seu celular.">
<meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1019" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-bq6nVbJdQ5lIDKoUS3Wxe+9ri8ZvAmtC89UPbPefhcw='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<link rel="preload" href="fontes/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilo.css">
<script>/* tema antes de pintar: sem piscar o claro no escuro */ try { var t = JSON.parse(localStorage.getItem("tema")); if (t === "claro" || t === "escuro") document.documentElement.dataset.theme = t === "claro" ? "light" : "dark"; } catch (e) {}</script>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<div class="app">
  <nav id="menu" class="menu" aria-label="Menu principal"></nav>
  <div class="principal">
    <header class="topo">
      <h1 id="titulo">Trocado</h1>
      <button id="btn-novo" class="icone-botao" type="button" aria-label="Lançar" title="Lançar">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 1 0 0-18M12 8v8M8 12h8"/></svg>
      </button>
      <button id="btn-ajustes" class="icone-botao" type="button" aria-label="Ajustes" title="Ajustes">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
      </button>
    </header>
    <div id="faixa" class="faixa" role="status" hidden></div>
    <main id="conteudo" tabindex="-1"></main>
  </div>
</div>
<nav id="barra" class="barra" aria-label="Menu"></nav>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<div id="folha-fundo" class="folha-fundo" hidden></div>
<section id="folha" class="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo" hidden>
  <header class="folha-topo">
    <h2 id="folha-titulo"></h2>
    <button id="folha-fechar" class="icone-botao" type="button" aria-label="Fechar">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>
  <div id="folha-corpo" class="folha-corpo"></div>
</section>

<dialog id="confirmar" class="dialogo">
  <form method="dialog">
    <p id="confirmar-texto"></p>
    <div class="acoes">
      <button class="secundario" type="submit" value="nao">Cancelar</button>
      <button id="confirmar-sim" class="perigo" type="submit" value="sim">Apagar</button>
    </div>
  </form>
</dialog>

<script src="util.js"></script>
<script src="base.js"></script>
<script src="telas.js"></script>
</body>
</html>
